{% extends "base.html" %}
{% block title %}Add Title — {{ char.name }} — SWTOR Tracker{% endblock %}

{% block content %}
<div class="page-header">
  <h1 class="page-title">Add Title</h1>
  <a href="{{ url_for('characters.detail', cid=char.id) }}" class="btn btn-ghost btn-sm">&larr; {{ char.name }}</a>
</div>

<form method="post" action="{{ action_url }}" class="form-card">
  <div class="form-grid">

    <div class="form-group form-group-wide">
      <label class="form-label" for="title">Title <span class="required">*</span></label>
      <input class="form-control" type="text" id="title" name="title" required
             placeholder="e.g. Darth, The Butcher of Coruscant, Hero of Tython">
    </div>

    <div class="form-group">
      <label class="form-label" for="earned_at">When Earned</label>
      <input class="form-control" type="text" id="earned_at" name="earned_at"
             placeholder="e.g. After Shadow of Revan, Chapter 16">
    </div>

    <div class="form-group form-group-wide">
      <label class="form-label" for="notes">Notes</label>
      <textarea class="form-control form-textarea" id="notes" name="notes"
                placeholder="How the title was earned, what it means to the character…"></textarea>
    </div>

  </div>

  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Add Title</button>
    <a href="{{ url_for('characters.detail', cid=char.id) }}" class="btn btn-ghost">Cancel</a>
  </div>
</form>
{% endblock %}
