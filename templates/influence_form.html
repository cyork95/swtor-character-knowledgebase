{% extends "base.html" %}
{% block title %}Log Influence — {{ char.name }} — SWTOR Tracker{% endblock %}
{% block content %}
<div class="page-header">
  <h1 class="page-title">Log Influence Change</h1>
  <a href="{{ url_for('characters.detail', cid=char.id) }}" class="btn btn-ghost btn-sm">&larr; {{ char.name }}</a>
</div>
<form method="post" action="{{ url_for('influence.add', cid=char.id) }}" class="form-card">
  <div class="form-grid">
    <div class="form-group form-group-wide">
      <label class="form-label" for="companion_name">Companion <span class="required">*</span></label>
      <select class="form-control" id="companion_name" name="companion_name">
        <option value="">— Select Companion —</option>
        {% for comp in companions %}
        <option value="{{ comp.name }}"
          {% if preselect == comp.name %}selected{% endif %}>
          {{ comp.name }}
        </option>
        {% endfor %}
        <option value="__other__">Other (type below)</option>
      </select>
    </div>
    <div class="form-group form-group-wide" id="other-name-group" style="display:none">
      <label class="form-label" for="companion_name_other">Companion Name</label>
      <input class="form-control" type="text" id="companion_name_other" placeholder="Enter companion name">
    </div>
    <div class="form-group">
      <label class="form-label" for="influence_change">Influence Change <span class="required">*</span></label>
      <input class="form-control" type="number" id="influence_change" name="influence_change"
             placeholder="e.g. +200 or -150" required>
      <span class="form-hint">Positive = gained, negative = lost.</span>
    </div>
    <div class="form-group">
      <label class="form-label" for="source">Source</label>
      <input class="form-control" type="text" id="source" name="source"
             placeholder="e.g. Story decision, Side quest, Conversation">
    </div>
    <div class="form-group form-group-wide">
      <label class="form-label" for="notes">Notes</label>
      <input class="form-control" type="text" id="notes" name="notes"
             placeholder="Optional detail about this interaction">
    </div>
  </div>
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Log Influence</button>
    <a href="{{ url_for('characters.detail', cid=char.id) }}" class="btn btn-ghost">Cancel</a>
  </div>
</form>
{% endblock %}

{% block extra_scripts %}
<script>
(function() {
  var sel = document.getElementById('companion_name');
  var otherGroup = document.getElementById('other-name-group');
  var otherInput = document.getElementById('companion_name_other');

  sel.addEventListener('change', function() {
    if (this.value === '__other__') {
      otherGroup.style.display = '';
      otherInput.name = 'companion_name';
      sel.name = '_companion_select';
    } else {
      otherGroup.style.display = 'none';
      otherInput.name = '_companion_other';
      sel.name = 'companion_name';
    }
  });
})();
</script>
{% endblock %}
