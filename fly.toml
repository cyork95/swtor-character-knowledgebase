app = "swtor-tracker"
primary_region = "ord"

[build]

[env]
  SWTOR_DB_PATH = "/data/swtor.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "swtor_data"
  destination = "/data"
  initial_size = "1gb"
