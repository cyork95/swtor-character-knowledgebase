# fly.toml app configuration file generated for swtor-tracker on 2026-06-05T12:29:03-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'swtor-tracker'
primary_region = 'ord'

[build]

[env]
  SWTOR_DB_PATH = '/data/swtor.db'

[[mounts]]
  source = 'swtor_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
